services:
  app:
    build:
      context: ./..
      dockerfile: docker/Dockerfile_dev
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: ":8080"
      # Inside the bind-mounted repo, so both appear on the host under
      # ./host_files.
      BACKUP_DIR: /app/host_files/backups
      SCRIPTS_DIR: /app/host_files/scripts
    volumes:
      - ..:/app
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    init: true
    restart: unless-stopped

volumes:
  gomod:
  gobuild: