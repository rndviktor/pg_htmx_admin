<div id="ddl-panel-{{ .PanelID }}" class="ddl-panel" data-panel-id="{{ .PanelID }}" data-preview="{{ .PreviewURL }}" data-action="{{ .Action }}" data-folder="{{ .FolderID }}" data-db="{{ .ConnDB }}">
    <div class="flex justify-between items-center px-4 py-2 border-b border-gray-700">
        <h3 class="text-sm font-bold text-white">{{ .Title }}</h3>
        <div class="flex items-center gap-2">
            <button type="button" data-panel-reset class="px-2 py-1 text-xs text-gray-300 hover:text-white border border-gray-600 rounded" title="Reload the form from the current definition (use after running the SQL)">Reset</button>
            <button type="button" data-panel-collapse class="px-2 py-1 text-sm text-gray-300 hover:text-white border border-gray-600 rounded" title="Hide this panel">&lt;&lt;</button>
        </div>
    </div>
    <div data-panel-status class="hidden px-4 py-1 text-xs text-yellow-400"></div>
    {{ if .Error }}<div class="text-xs text-red-400 bg-red-900/40 border border-red-800 rounded p-2 m-3">{{ .Error }}</div>{{ end }}

    <form class="space-y-4 p-4" onsubmit="return false">
            <input type="hidden" name="mode" value="drop">
            <input type="hidden" name="server_id" value="{{ .ServerID }}">
            <input type="hidden" name="folder_id" value="{{ .FolderID }}">
            <input type="hidden" name="db" value="{{ .DB }}">
            <input type="hidden" name="schema" value="{{ .Schema }}">
            <input type="hidden" name="table" value="{{ .Table }}">

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Object Name</label>
                <input type="text" name="name" required value="{{ .Name }}"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm"
                       autocomplete="off" spellcheck="false">
            </div>

            {{ if .HasForce }}
            <label class="flex items-center space-x-2 text-sm text-gray-300">
                <input type="checkbox" name="force" value="on" {{ if .Force }}checked{{ end }} class="accent-blue-500">
                <span>Force disconnect other sessions</span>
            </label>
            {{ end }}

            {{ if .HasCascade }}
            <label class="flex items-center space-x-2 text-sm text-gray-300">
                <input type="checkbox" name="cascade" value="on" class="accent-blue-500">
                <span>Add CASCADE</span>
            </label>
            {{ end }}

            <p class="text-xs text-gray-500">This cannot be undone. Dependent objects may block the drop.</p>
    </form>
</div>
