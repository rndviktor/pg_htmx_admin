<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 backdrop-blur-sm">
    <div class="bg-gray-800 border border-gray-700 rounded-lg shadow-2xl w-full max-w-md p-6">
        <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
            <h3 class="text-lg font-bold text-white">Register - Server Connection</h3>
            <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-gray-400 hover:text-white">✕</button>
        </div>

        {{ if .Error }}<div class="text-xs text-red-400 bg-red-900/40 border border-red-800 rounded p-2 mb-3">{{ .Error }}</div>{{ end }}

        <form hx-post="/api/servers" hx-target="#modal-container" hx-swap="innerHTML" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Name</label>
                <input type="text" name="name" required placeholder="Local Dev" value="{{ index .Values "name" }}" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
            </div>
            <div class="grid grid-cols-3 gap-2">
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Host</label>
                    <input type="text" name="host" required placeholder="localhost" value="{{ index .Values "host" }}" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Port</label>
                    <input type="number" name="port" value="{{ index .Values "port" }}" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Maintenance Database</label>
                <input type="text" name="dbname" value="{{ index .Values "dbname" }}" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Username</label>
                    <input type="text" name="username" required placeholder="postgres" value="{{ index .Values "username" }}" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Password</label>
                    <input type="password" name="password" value="{{ index .Values "password" }}" autocomplete="current-password" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">SSL Mode</label>
                <select name="sslmode" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                    <option value="disable" {{ if eq (index .Values "sslmode") "disable" }}selected{{ end }}>Disable</option>
                    <option value="prefer" {{ if eq (index .Values "sslmode") "prefer" }}selected{{ end }}>Prefer</option>
                    <option value="require" {{ if eq (index .Values "sslmode") "require" }}selected{{ end }}>Require</option>
                </select>
            </div>

            <div class="flex justify-end space-x-2 pt-4 border-t border-gray-700">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-300 rounded text-sm">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-medium">Save Connection</button>
            </div>
        </form>
    </div>
</div>
