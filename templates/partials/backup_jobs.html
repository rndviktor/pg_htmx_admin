<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 backdrop-blur-sm"
     onclick="if (event.target === this) closeDDL()">
    <div class="bg-gray-800 border border-gray-700 rounded-lg shadow-2xl modal-panel w-full max-w-md p-6 max-h-screen overflow-y-auto">
        <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
            <h3 class="text-lg font-bold text-white">Background Jobs</h3>
            <button onclick="closeDDL()" class="text-gray-400 hover:text-white">&#10005;</button>
        </div>

        <ul class="divide-y divide-gray-700 max-h-80 overflow-auto">
            {{ range .Jobs }}
            <li class="flex items-center justify-between py-2 text-sm text-gray-300">
                <span class="min-w-0">
                    <span class="block font-mono truncate">{{ .Label }}</span>
                    <span class="text-xs {{ if eq .Status "done" }}text-green-400{{ else if .Running }}text-blue-400{{ else if eq .Status "cancelled" }}text-yellow-400{{ else }}text-red-400{{ end }}">{{ .Status }}</span>
                    <span class="text-xs text-gray-500">&middot; {{ .Elapsed }}</span>
                </span>
                <button type="button" hx-get="/api/backup/jobs/{{ .ID }}" hx-target="#modal-container" hx-swap="innerHTML"
                        class="ml-3 shrink-0 text-blue-400 hover:text-blue-300">View</button>
            </li>
            {{ else }}
            <li class="py-2 text-sm text-gray-500">No jobs since the server started.</li>
            {{ end }}
        </ul>
    </div>
</div>
