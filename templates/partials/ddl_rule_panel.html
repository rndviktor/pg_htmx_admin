<div id="ddl-panel-{{ .PanelID }}" class="ddl-panel" data-panel-id="{{ .PanelID }}" data-preview="{{ .PreviewURL }}" data-action="{{ .Action }}" data-folder="{{ .FolderID }}" data-db="{{ .ConnDB }}">
    <div class="flex justify-between items-center px-4 py-2 border-b border-gray-700">
        <h3 class="text-sm font-bold text-white">{{ .Title }}</h3>
        <div class="flex items-center gap-2">
            <button type="button" data-panel-reset class="px-2 py-1 text-xs text-gray-300 hover:text-white border border-gray-600 rounded" title="Reload the form from the current definition (use after running the SQL)">Reset</button>
            <button type="button" data-panel-collapse class="px-2 py-1 text-sm text-gray-300 hover:text-white border border-gray-600 rounded" title="Hide this panel">&lt;&lt;</button>
        </div>
    </div>
    <div data-panel-status class="hidden px-4 py-1 text-xs text-yellow-400"></div>
    {{ if .Error }}<div class="text-xs text-red-400 bg-red-900/40 border border-red-800 rounded p-2 m-3">{{ .Error }}</div>{{ end }}

    <form class="space-y-4 p-4" onsubmit="return false">
            <input type="hidden" name="server_id" value="{{ .ServerID }}">
            <input type="hidden" name="folder_id" value="{{ .FolderID }}">
            <input type="hidden" name="db" value="{{ .DB }}">
            <input type="hidden" name="schema" value="{{ .Schema }}">
            <input type="hidden" name="table" value="{{ .Table }}">

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Name</label>
                <input type="text" name="name" required placeholder="log_updates" value="{{ index .Values "name" }}"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm"
                       autocomplete="off" spellcheck="false">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Event</label>
                    <select name="event" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                        <option value="SELECT" {{ if eq (index .Values "event") "SELECT" }}selected{{ end }}>SELECT</option>
                        <option value="INSERT" {{ if eq (index .Values "event") "INSERT" }}selected{{ end }}>INSERT</option>
                        <option value="UPDATE" {{ if eq (index .Values "event") "UPDATE" }}selected{{ end }}>UPDATE</option>
                        <option value="DELETE" {{ if eq (index .Values "event") "DELETE" }}selected{{ end }}>DELETE</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Do</label>
                    <select name="do_kind" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                        <option value="ALSO" {{ if ne (index .Values "do_kind") "INSTEAD" }}selected{{ end }}>ALSO</option>
                        <option value="INSTEAD" {{ if eq (index .Values "do_kind") "INSTEAD" }}selected{{ end }}>INSTEAD</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">When expression (optional)</label>
                <input type="text" name="where_expr" placeholder="NEW.status IS DISTINCT FROM OLD.status" value="{{ index .Values "where_expr" }}"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm font-mono"
                       autocomplete="off" spellcheck="false">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Action</label>
                <p class="text-xs text-gray-500 mb-1">Type NOTHING to do nothing, a single command, or several wrapped in parens yourself: ( cmd1; cmd2 ).</p>
                <input type="text" name="action" required placeholder="NOTHING" value="{{ index .Values "action" }}"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm font-mono"
                       autocomplete="off" spellcheck="false">
            </div>
    </form>
</div>
