<div data-page="{{ .Page }}" data-total="{{ .Total }}" data-total-pages="{{ .TotalPages }}" data-limit="{{ .Limit }}" data-elapsed="{{ printf "%.5f" .Elapsed }}" data-is-error="{{ if .IsError }}true{{ else }}false{{ end }}" data-message="{{ .Message }}" class="query-result">
{{ if .Message }}{{ if .IsError }}<div class="px-3 py-2 text-xs font-mono bg-red-900/30 border-b border-red-800 text-red-400">{{ .Message }}</div>{{ else }}<div class="px-3 py-2 text-xs font-mono bg-gray-800/40 border-b border-gray-700 text-green-400">{{ .Message }}</div>{{ end }}{{ end }}
{{ if .Headers }}
<table class="w-full border-collapse text-xs text-left">
  <thead class="bg-gray-800 text-gray-400 sticky top-0 z-10">
    <tr>
      <th class="px-2 py-1 border border-gray-700 border-b border-gray-600"></th>
      {{ range .Headers }}<th class="px-2 py-1 border border-gray-700 border-b border-gray-600 font-bold">{{ . }}</th>{{ end }}
    </tr>
  </thead>
  <tbody>
    {{ range $i, $row := .Rows }}
    <tr class="hover:bg-gray-800/50">
      <td class="px-2 py-1 border border-gray-700 bg-gray-800/30 text-center text-gray-500">{{ add $.Offset $i }}</td>
      {{ range . }}<td class="px-2 py-1 border border-gray-700">{{ . }}</td>{{ end }}
    </tr>
    {{ end }}
  </tbody>
</table>
{{ end }}
</div>
