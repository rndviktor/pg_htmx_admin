<div id="ddl-panel-{{ .PanelID }}" class="ddl-panel" data-action="{{ .Action }}" data-folder="{{ .FolderID }}" data-db="{{ .ConnDB }}">
    <div class="flex justify-between items-center px-4 py-2 border-b border-gray-700">
        <h3 class="text-sm font-bold text-white">{{ .Title }}</h3>
        <div class="flex items-center gap-2">
            <button type="button" data-panel-reset hx-get="{{ .ResetURL }}" hx-target="#ddl-panel-{{ .PanelID }}" hx-swap="outerHTML" class="px-2 py-1 text-xs text-gray-300 hover:text-white border border-gray-600 rounded" title="Reload the form from the current definition (use after running the SQL)">Reset</button>
            <button type="button" data-panel-toggle class="px-2 py-1 text-sm text-gray-300 hover:text-white border border-gray-600 rounded" title="Hide this panel">&lt;&lt;</button>
        </div>
    </div>
    <div id="ddl-out-{{ .PanelID }}" class="ddl-out"></div>
    {{ if .Error }}<div class="text-xs text-red-400 bg-red-900/40 border border-red-800 rounded p-2 m-3">{{ .Error }}</div>{{ end }}

    <form hx-post="{{ .PreviewURL }}" hx-trigger="{{ if ne .Action "create" }}load, {{ end }}input changed delay:400ms, change, panel-changed" hx-target="#ddl-out-{{ .PanelID }}" hx-sync="this:replace" class="space-y-4 p-4" onsubmit="return false">
            <input type="hidden" name="server_id" value="{{ .ServerID }}">
            <input type="hidden" name="folder_id" value="{{ .FolderID }}">
            <input type="hidden" name="db" value="{{ .DB }}">
            <input type="hidden" name="schema" value="{{ .Schema }}">
            <input type="hidden" name="table" value="{{ .Table }}">

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Name</label>
                    <input type="text" name="name" required placeholder="orders" value="{{ index .Values "name" }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm"
                           autocomplete="off" spellcheck="false">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Owner</label>
                    <select name="owner" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                        <option value=""></option>
                        {{ range (index .Dropdowns "roles") }}<option value="{{ . }}" {{ if eq . (index $.Values "owner") }}selected{{ end }}>{{ . }}</option>{{ end }}
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Columns</label>
                <p class="text-xs text-gray-500 mb-1">Key: PK = table primary key (pick on several rows for a composite key), UQ = inline UNIQUE. Default and Generated are raw SQL expressions (quote string literals yourself); a column can have one or the other, not both.</p>
                <div id="ddl-columns-{{ .PanelID }}" class="space-y-1">
                    <div data-col-row class="ddl-col-row">
                        <input type="text" name="col_name" placeholder="id" value="{{ index .Values "col_name" }}" autocomplete="off" spellcheck="false"
                               class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Column name">
                        <input type="text" name="col_type" list="ddl-coltypes-{{ .PanelID }}" placeholder="bigint" value="{{ index .Values "col_type" }}" autocomplete="off" spellcheck="false"
                               class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Data type">
                        <select name="col_nullable" class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Nullable">
                            <option value="YES" {{ if eq (index .Values "col_nullable") "NO" }}{{ else }}selected{{ end }}>NULL</option>
                            <option value="NO" {{ if eq (index .Values "col_nullable") "NO" }}selected{{ end }}>NOT NULL</option>
                        </select>
                        <input type="text" name="col_default" placeholder="default" value="{{ index .Values "col_default" }}" autocomplete="off" spellcheck="false"
                               class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Default expression">
                        <input type="text" name="col_generated" placeholder="generated as" value="{{ index .Values "col_generated" }}" autocomplete="off" spellcheck="false"
                               class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Generated column expression (STORED)">
                        <select name="col_key" class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Primary key / unique">
                            <option value="" {{ if not (eq (index .Values "col_key") "pk") }}{{ if not (eq (index .Values "col_key") "uniq") }}selected{{ end }}{{ end }}>-</option>
                            <option value="pk" {{ if eq (index .Values "col_key") "pk" }}selected{{ end }}>PK</option>
                            <option value="uniq" {{ if eq (index .Values "col_key") "uniq" }}selected{{ end }}>UQ</option>
                        </select>
                        <button type="button" hx-get="/api/ddl/table/column-row?variant=remove" hx-target="closest [data-col-row]" hx-swap="outerHTML"
                                class="text-red-400 hover:text-red-300 text-xs px-1" title="Remove column">&#10005;</button>
                    </div>
                    <div data-col-row class="ddl-col-row">
                        <input type="text" name="col_name" placeholder="created_at" autocomplete="off" spellcheck="false"
                               class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Column name">
                        <input type="text" name="col_type" list="ddl-coltypes-{{ .PanelID }}" placeholder="timestamptz" autocomplete="off" spellcheck="false"
                               class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Data type">
                        <select name="col_nullable" class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Nullable">
                            <option value="YES" selected>NULL</option>
                            <option value="NO">NOT NULL</option>
                        </select>
                        <input type="text" name="col_default" placeholder="now()" autocomplete="off" spellcheck="false"
                               class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Default expression">
                        <input type="text" name="col_generated" placeholder="generated as" autocomplete="off" spellcheck="false"
                               class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Generated column expression (STORED)">
                        <select name="col_key" class="flex-1 min-w-0 bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs" title="Primary key / unique">
                            <option value="" selected>-</option>
                            <option value="pk">PK</option>
                            <option value="uniq">UQ</option>
                        </select>
                        <button type="button" hx-get="/api/ddl/table/column-row?variant=remove" hx-target="closest [data-col-row]" hx-swap="outerHTML"
                                class="text-red-400 hover:text-red-300 text-xs px-1" title="Remove column">&#10005;</button>
                    </div>
                </div>
                <button type="button" hx-get="/api/ddl/table/column-row?variant=create&panel_id={{ .PanelID }}" hx-target="#ddl-columns-{{ .PanelID }}" hx-swap="beforeend"
                        class="mt-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 text-gray-300 rounded text-xs border border-gray-600">+ Add column</button>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Check constraint (optional)</label>
                <input type="text" name="check_expr" placeholder="price > 0" value="{{ index .Values "check_expr" }}"
                       autocomplete="off" spellcheck="false"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm font-mono">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Foreign key (optional)</label>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="text" name="fk_name" placeholder="constraint name (optional)" value="{{ index .Values "fk_name" }}"
                           autocomplete="off" spellcheck="false"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs">
                    <input type="text" name="fk_local_cols" placeholder="local column(s), e.g. customer_id" value="{{ index .Values "fk_local_cols" }}"
                           autocomplete="off" spellcheck="false"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs">
                </div>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">References table</label>
                        <select name="fk_ref_table"
                                hx-get="/api/ddl/table/fk-ref-columns" hx-trigger="change" hx-include="closest form"
                                hx-target="#ddl-panel-{{ .PanelID }} select[name='fk_ref_cols']" hx-swap="outerHTML"
                                class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs">
                            <option value="">(pick a table)</option>
                            {{ range (index .Dropdowns "ref_tables") }}<option value="{{ . }}" {{ if eq . (index $.Values "fk_ref_table") }}selected{{ end }}>{{ . }}</option>{{ end }}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">References column(s)</label>
                        <select multiple name="fk_ref_cols" size="4" title="Referenced column(s)"
                                class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs">
                            {{ if not .FKRefColumns }}<option value="" disabled>Pick a target table first</option>{{ end }}
                            {{ range .FKRefColumns }}<option value="{{ . }}" {{ if contains $.FKRefColsSelected . }}selected{{ end }}>{{ . }}</option>{{ end }}
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Match</label>
                        <select name="fk_match" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs">
                            <option value="" {{ if ne (index .Values "fk_match") "FULL" }}selected{{ end }}>SIMPLE</option>
                            <option value="FULL" {{ if eq (index .Values "fk_match") "FULL" }}selected{{ end }}>FULL</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Deferrable</label>
                        <select name="fk_deferrable" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs">
                            <option value="" {{ if eq (index .Values "fk_deferrable") "" }}selected{{ end }}>Not deferrable</option>
                            <option value="deferrable" {{ if eq (index .Values "fk_deferrable") "deferrable" }}selected{{ end }}>Deferrable</option>
                            <option value="deferred" {{ if eq (index .Values "fk_deferrable") "deferred" }}selected{{ end }}>Deferrable, initially deferred</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">On update</label>
                        <select name="fk_on_update" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs">
                            <option value="" {{ if eq (index .Values "fk_on_update") "" }}selected{{ end }}>NO ACTION</option>
                            <option value="RESTRICT" {{ if eq (index .Values "fk_on_update") "RESTRICT" }}selected{{ end }}>RESTRICT</option>
                            <option value="CASCADE" {{ if eq (index .Values "fk_on_update") "CASCADE" }}selected{{ end }}>CASCADE</option>
                            <option value="SET NULL" {{ if eq (index .Values "fk_on_update") "SET NULL" }}selected{{ end }}>SET NULL</option>
                            <option value="SET DEFAULT" {{ if eq (index .Values "fk_on_update") "SET DEFAULT" }}selected{{ end }}>SET DEFAULT</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">On delete</label>
                        <select name="fk_on_delete" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs">
                            <option value="" {{ if eq (index .Values "fk_on_delete") "" }}selected{{ end }}>NO ACTION</option>
                            <option value="RESTRICT" {{ if eq (index .Values "fk_on_delete") "RESTRICT" }}selected{{ end }}>RESTRICT</option>
                            <option value="CASCADE" {{ if eq (index .Values "fk_on_delete") "CASCADE" }}selected{{ end }}>CASCADE</option>
                            <option value="SET NULL" {{ if eq (index .Values "fk_on_delete") "SET NULL" }}selected{{ end }}>SET NULL</option>
                            <option value="SET DEFAULT" {{ if eq (index .Values "fk_on_delete") "SET DEFAULT" }}selected{{ end }}>SET DEFAULT</option>
                        </select>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Exclusion constraint (optional)</label>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="text" name="exclude_name" placeholder="constraint name (optional)" value="{{ index .Values "exclude_name" }}"
                           autocomplete="off" spellcheck="false"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs">
                    <input type="text" name="exclude_method" list="ddl-am-{{ .PanelID }}" placeholder="gist" value="{{ index .Values "exclude_method" }}"
                           autocomplete="off" spellcheck="false"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-xs">
                </div>
                <input type="text" name="exclude_elements" placeholder="room_id WITH =, during WITH &amp;&amp;" value="{{ index .Values "exclude_elements" }}"
                       autocomplete="off" spellcheck="false"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm font-mono mb-2">
                <input type="text" name="exclude_where" placeholder="WHERE predicate (optional)" value="{{ index .Values "exclude_where" }}"
                       autocomplete="off" spellcheck="false"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm font-mono">
            </div>
            <datalist id="ddl-am-{{ .PanelID }}">
                <option value="gist"></option>
                <option value="btree"></option>
                <option value="gin"></option>
                <option value="spgist"></option>
                <option value="brin"></option>
            </datalist>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Partition by (optional)</label>
                <div class="grid grid-cols-2 gap-2">
                    <select name="partition_strategy" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                        <option value="" {{ if eq (index .Values "partition_strategy") "" }}selected{{ end }}>(not partitioned)</option>
                        <option value="RANGE" {{ if eq (index .Values "partition_strategy") "RANGE" }}selected{{ end }}>RANGE</option>
                        <option value="LIST" {{ if eq (index .Values "partition_strategy") "LIST" }}selected{{ end }}>LIST</option>
                        <option value="HASH" {{ if eq (index .Values "partition_strategy") "HASH" }}selected{{ end }}>HASH</option>
                    </select>
                    <input type="text" name="partition_key" placeholder="column(s) or expression, e.g. created_at" value="{{ index .Values "partition_key" }}"
                           autocomplete="off" spellcheck="false"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm font-mono">
                </div>
            </div>
    </form>

<datalist id="ddl-coltypes-{{ .PanelID }}">
    <option value="bigint"></option>
    <option value="bigserial"></option>
    <option value="boolean"></option>
    <option value="bytea"></option>
    <option value="character varying(255)"></option>
    <option value="date"></option>
    <option value="double precision"></option>
    <option value="integer"></option>
    <option value="interval"></option>
    <option value="jsonb"></option>
    <option value="json"></option>
    <option value="numeric(12, 2)"></option>
    <option value="real"></option>
    <option value="serial"></option>
    <option value="smallint"></option>
    <option value="smallserial"></option>
    <option value="text"></option>
    <option value="time"></option>
    <option value="timetz"></option>
    <option value="timestamp"></option>
    <option value="timestamptz"></option>
    <option value="uuid"></option>
</datalist>
</div>
