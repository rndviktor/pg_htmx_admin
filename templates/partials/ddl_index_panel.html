<div id="ddl-panel-{{ .PanelID }}" class="ddl-panel" data-action="{{ .Action }}" data-folder="{{ .FolderID }}" data-db="{{ .ConnDB }}">
    <div class="flex justify-between items-center px-4 py-2 border-b border-gray-700">
        <h3 class="text-sm font-bold text-white">{{ .Title }}</h3>
        <div class="flex items-center gap-2">
            <button type="button" data-panel-reset hx-get="{{ .ResetURL }}" hx-target="#ddl-panel-{{ .PanelID }}" hx-swap="outerHTML" class="px-2 py-1 text-xs text-gray-300 hover:text-white border border-gray-600 rounded" title="Reload the form from the current definition (use after running the SQL)">Reset</button>
            <button type="button" data-panel-toggle class="px-2 py-1 text-sm text-gray-300 hover:text-white border border-gray-600 rounded" title="Hide this panel">&lt;&lt;</button>
        </div>
    </div>
    <div id="ddl-out-{{ .PanelID }}" class="ddl-out"></div>
    {{ if .Error }}<div class="text-xs text-red-400 bg-red-900/40 border border-red-800 rounded p-2 m-3">{{ .Error }}</div>{{ end }}

    <form hx-post="{{ .PreviewURL }}" hx-trigger="{{ if ne .Action "create" }}load, {{ end }}input changed delay:400ms, change, panel-changed" hx-target="#ddl-out-{{ .PanelID }}" hx-sync="this:replace" class="space-y-4 p-4" onsubmit="return false">
            <input type="hidden" name="server_id" value="{{ .ServerID }}">
            <input type="hidden" name="folder_id" value="{{ .FolderID }}">
            <input type="hidden" name="db" value="{{ .DB }}">
            <input type="hidden" name="schema" value="{{ .Schema }}">
            <input type="hidden" name="table" value="{{ .Table }}">

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Name (optional)</label>
                    <input type="text" name="name" placeholder="auto" value="{{ index .Values "name" }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm"
                           autocomplete="off" spellcheck="false">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Access method</label>
                    <select name="method" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                        <option value="btree" {{ if eq (index .Values "method") "btree" }}selected{{ end }}>btree</option>
                        <option value="hash" {{ if eq (index .Values "method") "hash" }}selected{{ end }}>hash</option>
                        <option value="gist" {{ if eq (index .Values "method") "gist" }}selected{{ end }}>gist</option>
                        <option value="gin" {{ if eq (index .Values "method") "gin" }}selected{{ end }}>gin</option>
                        <option value="spgist" {{ if eq (index .Values "method") "spgist" }}selected{{ end }}>spgist</option>
                        <option value="brin" {{ if eq (index .Values "method") "brin" }}selected{{ end }}>brin</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Indexed columns</label>
                    <select name="columns" multiple required size="6"
                            class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                        {{ range (index .Dropdowns "columns") }}<option value="{{ . }}">{{ . }}</option>{{ end }}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Include columns (optional)</label>
                    <select name="include_cols" multiple size="6"
                            class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                        {{ range (index .Dropdowns "columns") }}<option value="{{ . }}">{{ . }}</option>{{ end }}
                    </select>
                </div>
            </div>

            <label class="flex items-center space-x-2 text-sm text-gray-300">
                <input type="checkbox" name="unique" {{ if eq (index .Values "unique") "on" }}checked{{ end }} class="accent-blue-500">
                <span>UNIQUE</span>
            </label>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Storage parameters (optional)</label>
                <input type="text" name="storage_params" placeholder="fillfactor = 70" value="{{ index .Values "storage_params" }}"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm font-mono"
                       autocomplete="off" spellcheck="false">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Where predicate (optional, partial index)</label>
                <input type="text" name="where_expr" placeholder="status = 'active'" value="{{ index .Values "where_expr" }}"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm font-mono"
                       autocomplete="off" spellcheck="false">
            </div>
    </form>
</div>
