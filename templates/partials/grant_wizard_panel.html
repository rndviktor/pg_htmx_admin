<div id="ddl-panel-{{ .PanelID }}" class="ddl-panel" data-action="{{ .Action }}" data-folder="{{ .FolderID }}" data-db="{{ .ConnDB }}">
    <div class="flex justify-between items-center px-4 py-2 border-b border-gray-700">
        <h3 class="text-sm font-bold text-white">{{ .Title }}</h3>
        <div class="flex items-center gap-2">
            <button type="button" data-panel-reset hx-get="{{ .ResetURL }}" hx-target="#ddl-panel-{{ .PanelID }}" hx-swap="outerHTML" class="px-2 py-1 text-xs text-gray-300 hover:text-white border border-gray-600 rounded" title="Reload the wizard">Reset</button>
            <button type="button" data-panel-toggle class="px-2 py-1 text-sm text-gray-300 hover:text-white border border-gray-600 rounded" title="Hide this panel">&lt;&lt;</button>
        </div>
    </div>
    <div id="ddl-out-{{ .PanelID }}" class="ddl-out"></div>
    {{ if .Error }}<div class="text-xs text-red-400 bg-red-900/40 border border-red-800 rounded p-2 m-3">{{ .Error }}</div>{{ end }}

    <form id="grant-form-{{ .PanelID }}" hx-post="{{ .PreviewURL }}" hx-trigger="load, input changed delay:400ms, change, change from:#grant-objs-{{ .PanelID }}, panel-changed" hx-target="#ddl-out-{{ .PanelID }}" hx-sync="this:replace" class="space-y-4 p-4" onsubmit="return false">
        <input type="hidden" name="server_id" value="{{ .ServerID }}">
        <input type="hidden" name="db" value="{{ .DB }}">
        <input type="hidden" name="schema" value="{{ .Schema }}">

        <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Action</label>
            <select name="mode" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                <option value="grant">Grant</option>
                <option value="revoke">Revoke</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Grantees</label>
            <select multiple name="grantee" size="5" title="Grantees" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                {{ range .Grantees }}<option value="{{ . }}">{{ . }}</option>{{ end }}
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Privileges</label>
            <div class="grid grid-cols-2 gap-2">
                {{ range .Privs }}
                <label class="flex items-center space-x-2 text-sm text-gray-300">
                    <input type="checkbox" name="priv" value="{{ . }}" class="accent-blue-500"><span>{{ . }}</span>
                </label>
                {{ end }}
            </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center space-x-2 text-sm text-gray-300">
                <input type="checkbox" name="grantopt" class="accent-blue-500"><span>WITH GRANT OPTION</span>
            </label>
            <label class="flex items-center space-x-2 text-sm text-gray-300">
                <input type="checkbox" name="cascade" class="accent-blue-500"><span>CASCADE (revoke)</span>
            </label>
        </div>
    </form>

    <div id="grant-objs-{{ .PanelID }}" class="p-4 pt-0" hx-get="{{ .ObjectsURL }}" hx-trigger="load" hx-swap="innerHTML">
        <p class="text-xs text-gray-500">Loading objects...</p>
    </div>
</div>
