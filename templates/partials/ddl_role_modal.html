<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 backdrop-blur-sm"
     onclick="if (event.target === this) closeDDL()">
    <div class="bg-gray-800 border border-gray-700 rounded-lg shadow-2xl w-full max-w-lg p-6">
        <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
            <h3 class="text-lg font-bold text-white">Create - Role</h3>
            <button onclick="closeDDL()" class="text-gray-400 hover:text-white">&#10005;</button>
        </div>

        {{ if .Error }}<div class="text-xs text-red-400 bg-red-900/40 border border-red-800 rounded p-2 mb-3">{{ .Error }}</div>{{ end }}

        <form hx-post="/api/ddl/role/create" hx-target="#modal-container" hx-swap="innerHTML"
              hx-disabled-elt="button[type='submit']" class="space-y-4">
            <input type="hidden" name="server_id" value="{{ .ServerID }}">
            <input type="hidden" name="folder_id" value="{{ .FolderID }}">

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Name</label>
                <input type="text" name="name" required placeholder="app_user" value="{{ index .Values "name" }}"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm"
                       autocomplete="off" spellcheck="false">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Password</label>
                <input type="password" name="password" placeholder="Leave blank for a password-less role"
                       value="{{ index .Values "password" }}"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm" autocomplete="new-password" spellcheck="false">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center space-x-2 text-sm text-gray-300">
                    <input type="checkbox" name="login" {{ if eq (index .Values "login") "on" }}checked{{ end }} class="accent-blue-500">
                    <span>Can login?</span>
                </label>
                <label class="flex items-center space-x-2 text-sm text-gray-300">
                    <input type="checkbox" name="superuser" {{ if eq (index .Values "superuser") "on" }}checked{{ end }} class="accent-blue-500">
                    <span>Superuser?</span>
                </label>
                <label class="flex items-center space-x-2 text-sm text-gray-300">
                    <input type="checkbox" name="createdb" {{ if eq (index .Values "createdb") "on" }}checked{{ end }} class="accent-blue-500">
                    <span>Create databases?</span>
                </label>
                <label class="flex items-center space-x-2 text-sm text-gray-300">
                    <input type="checkbox" name="createrole" {{ if eq (index .Values "createrole") "on" }}checked{{ end }} class="accent-blue-500">
                    <span>Create roles?</span>
                </label>
                <label class="flex items-center space-x-2 text-sm text-gray-300">
                    <input type="checkbox" name="inherit" {{ if eq (index .Values "inherit") "on" }}checked{{ end }} class="accent-blue-500">
                    <span>Inherit?</span>
                </label>
                <label class="flex items-center space-x-2 text-sm text-gray-300">
                    <input type="checkbox" name="replication" {{ if eq (index .Values "replication") "on" }}checked{{ end }} class="accent-blue-500">
                    <span>Replication?</span>
                </label>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Connection Limit</label>
                    <input type="number" name="connlimit" value="{{ index .Values "connlimit" }}" placeholder="-1 (unlimited)"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Valid Until</label>
                    <input type="datetime-local" name="validuntil" value="{{ index .Values "validuntil" }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">SQL Preview</label>
                <div id="ddl-preview" class="bg-gray-900 border border-gray-700 rounded p-2 min-h-[5rem] max-h-40 overflow-auto">
                    <pre class="text-xs font-mono text-gray-300">CREATE ROLE ...</pre>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-4 border-t border-gray-700">
                <button type="button" onclick="closeDDL()"
                        class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-300 rounded text-sm">Cancel</button>
                <button type="button" hx-post="/api/ddl/role/preview" hx-include="closest form"
                        hx-target="#ddl-preview" hx-swap="innerHTML"
                        class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-300 rounded text-sm">Update SQL</button>
                <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-medium">Create Role</button>
            </div>
        </form>
    </div>
</div>
