<div data-node-url="{{ .NodeURL }}" data-table-url="{{ .TableURL }}" data-props-url="{{ .PropsURL }}">
{{ range .Items }}{{ template "ctx_item" . }}{{ end }}
</div>
{{ define "ctx_item" }}{{ if .Divider }}<div class="my-1 border-t border-gray-700"></div>
{{ else if .Sub }}<div class="relative group">
<button class="w-full text-left px-3 py-1.5 hover:bg-gray-700 flex items-center justify-between"><span>{{ .Label }}</span><span class="text-xs text-gray-500">&#9656;</span></button>
<div class="absolute left-full top-0 hidden group-hover:block bg-gray-800 border border-gray-600 rounded shadow-xl py-1 min-w-[12rem]">{{ range .Sub }}{{ template "ctx_item" . }}{{ end }}</div>
</div>
{{ else }}<button class="block w-full text-left px-3 py-1.5 hover:bg-gray-700{{ if .Danger }} text-red-400 hover:text-red-300{{ end }}"{{ range .Attrs }} {{ .HTML }}{{ end }}>{{ .Label }}</button>
{{ end }}{{ end }}
