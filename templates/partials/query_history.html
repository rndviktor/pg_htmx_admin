{{ if .Items }}
<div class="flex flex-col">
  {{ range .Items }}
  <button type="button"
          class="history-item w-full text-left px-2 py-1.5 border-b border-gray-700 hover:bg-gray-800 flex items-start gap-2 group"
          data-history-id="{{ .ID }}"
          data-history-b64="{{ .QueryB64 }}"
          data-history-executed="{{ .Executed }}"
          data-history-duration="{{ if .DurationMs.Valid }}{{ .DurationMs.Int64 }}{{ end }}"
          data-history-status="{{ if .Status.Valid }}{{ .Status.String }}{{ end }}"
          data-history-rows="{{ if .RowsAffected.Valid }}{{ .RowsAffected.Int64 }}{{ end }}"
          data-history-server="{{ .ServerID }}"
          data-history-db="{{ .DBName }}"
          title="Click to view query details">
    <div class="flex-1 min-w-0">
      <div class="font-mono text-xs text-gray-200 break-all">{{ .QueryShort }}</div>
      <div class="text-[10px] text-gray-400 mt-0.5 flex items-center gap-2">
        <span class="text-gray-500">{{ .Executed }}</span>
        {{ if .DurationMs.Valid }}<span class="text-blue-400">{{ .DurationMs.Int64 }} ms</span>{{ end }}
        {{ if .RowsAffected.Valid }}<span class="text-green-400">{{ .RowsAffected.Int64 }} rows</span>{{ end }}
        {{ if .Status.Valid }}<span class="{{ if eq .Status.String "error" }}text-red-400{{ else if eq .Status.String "cancelled" }}text-yellow-400{{ else }}text-green-500{{ end }}">{{ .Status.String }}</span>{{ end }}
      </div>
    </div>
  </button>
  {{ end }}
</div>
{{ else }}
<div class="p-3 text-xs text-gray-500 italic">No query history yet. Run a query to see it here.</div>
{{ end }}
