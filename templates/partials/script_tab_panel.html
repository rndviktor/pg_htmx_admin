<div class="relative flex flex-col h-full bg-gray-900 text-gray-200">

  <!-- Main Toolbar -->
  <div class="flex items-center gap-2 px-2 py-1.5 bg-gray-800 border-b border-gray-700">
    <button
      onclick="saveScript(this)"
      title="Save Query (Ctrl+S)"
      class="px-2 py-1 text-blue-400 hover:text-blue-300 hover:bg-gray-700 border border-gray-600 rounded text-sm inline-flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 3h13l3 3v15H4V3z"/>
        <rect x="7" y="3" width="8" height="5" rx="0.5"/>
        <line x1="12" y1="5" x2="12" y2="7"/>
        <rect x="7" y="12" width="10" height="9" rx="0.5"/>
        <line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
    </button>
    <button
      onclick="saveScriptAs(this)"
      title="Save Query As (Ctrl+Shift+S)"
      class="px-2 py-1 text-blue-400 hover:text-blue-300 hover:bg-gray-700 border border-gray-600 rounded text-sm inline-flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 3h13l3 3v8"/>
        <path d="M4 3v18h9"/>
        <rect x="7" y="3" width="8" height="5" rx="0.5"/>
        <line x1="12" y1="5" x2="12" y2="7"/>
        <path d="M7 12h8v2"/>
        <path d="M7 15v6h6"/>
        <path d="M21.17 14.17a1.41 1.41 0 0 0-2 0l-3.59 3.59a1 1 0 0 0-.26.49l-.32 2.22a.5.5 0 0 0 .56.56l2.22-.32a1 1 0 0 0 .49-.26l3.59-3.59a1.41 1.41 0 0 0 0-2z"/>
      </svg>
    </button>
<button
      onclick="executeQuery(this)"
      title="Execute Query (F5)"
      style="margin-left:1.25em"
      class="px-2 py-1 text-gray-300 hover:text-white hover:bg-gray-700 border border-gray-600 rounded text-sm">
      <span class="inline-block scale-[1.5]">&#9654;</span>
    </button>
    <button onclick="cancelRunningQuery(this)"
      title="Stop Running Query (Alt+Shift+C)"
      class="px-2 py-1 text-gray-300 hover:text-white hover:bg-gray-700 border border-gray-600 rounded text-sm">
      <span class="inline-block scale-[1.5]">&#9724;</span>
    </button>
    <button onclick="txCommand(this, 'BEGIN')" title="Begin transaction (BEGIN)"
      style="margin-left:1.25em"
      class="px-2 py-1 text-blue-400 hover:text-blue-300 hover:bg-gray-700 border border-gray-600 rounded text-sm inline-flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[27px] h-[27px]">
        <path d="M6 3v18" />
        <path d="M6 5h12l-3.5 4 3.5 4H6" />
      </svg>
    </button>
    <button onclick="txCommand(this, 'COMMIT')" title="Commit transaction (COMMIT)"
      class="px-2 py-1 text-green-400 hover:text-white hover:bg-gray-700 border border-gray-600 rounded text-sm inline-flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[27px] h-[27px]">
        <circle cx="12" cy="12" r="9" />
        <path d="M8 12.5l3 3 5-6" />
      </svg>
    </button>
    <button onclick="txCommand(this, 'ROLLBACK')" title="Roll back transaction (ROLLBACK)"
      class="px-2 py-1 text-red-400 hover:text-red-300 hover:bg-gray-700 border border-gray-600 rounded text-sm inline-flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[27px] h-[27px]">
        <path d="M9 14L4 9l5-5" />
        <path d="M4 9h10a6 6 0 0 1 0 12h-3" />
      </svg>
    </button>
    <label class="ac-toggle" title="Auto-commit is on: each statement commits by itself. Click to turn it off and run statements inside a transaction until you COMMIT or ROLLBACK.">
      <input type="checkbox" class="autocommit-toggle" checked onchange="autoCommitChanged(this)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[27px] h-[27px]">
        <path d="M13 2L4 14h7l-1 8 9-12h-7z" />
      </svg>
    </label>
    <span class="tx-badge hidden" title="">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-[18px] h-[18px]"><circle cx="12" cy="12" r="7" /></svg>
    </span>
    <button
      onclick="executeExplain(this, false)"
      title="Explain query (EXPLAIN) — F7"
      style="margin-left:1.25em"
      class="px-2 py-1 text-blue-400 hover:text-blue-300 hover:bg-gray-700 border border-gray-600 rounded text-sm inline-flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-[27px] h-[27px]">
        <rect x="18" y="10" width="68" height="78" rx="8" />
        <line x1="28" y1="20" x2="76" y2="20" />
        <rect x="28" y="30" width="30" height="48" rx="4" />
        <line x1="38" y1="40" x2="68" y2="40" />
        <line x1="38" y1="50" x2="68" y2="50" />
        <line x1="38" y1="60" x2="68" y2="60" />
        <line x1="38" y1="70" x2="68" y2="70" />
        <line x1="58" y1="45" x2="78" y2="45" />
        <line x1="58" y1="55" x2="78" y2="55" />
      </svg>
    </button>
    <button
      onclick="executeExplain(this, true)"
      title="Explain with timing and actual rows (EXPLAIN ANALYZE) — Shift+F7"
      class="px-2 py-1 text-blue-400 hover:text-blue-300 hover:bg-gray-700 border border-gray-600 rounded text-sm inline-flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="w-[27px] h-[27px]">
        <path d="M 39 21 C 25 21 19 33 21 48 C 23 53 28 54 31 52 Q 35 50 35 45"/>
        <path d="M 76 38 C 76 26 64 18 48 18 C 39 18 36 28 36 44 C 36 46 35.294 49.132 38.294 50.132"/>
        <circle cx="48" cy="34" r="2.2" fill="currentColor" stroke="none"/>
        <polyline points="45 46, 25 58, 40 57"/>
        <circle cx="68" cy="62" r="21"/>
        <line x1="64" y1="36" x2="72" y2="36"/>
        <line x1="68" y1="36" x2="68" y2="41"/>
        <line x1="80" y1="43" x2="84" y2="39" stroke-width="2.5"/>
        <line x1="68" y1="45" x2="68" y2="47" stroke-width="2"/>
        <line x1="68" y1="77" x2="68" y2="79" stroke-width="2"/>
        <line x1="51" y1="62" x2="53" y2="62" stroke-width="2"/>
        <line x1="83" y1="62" x2="85" y2="62" stroke-width="2"/>
        <line x1="56" y1="50" x2="57.5" y2="51.5" stroke-width="2"/>
        <line x1="78.5" y1="72.5" x2="80" y2="74" stroke-width="2"/>
        <line x1="56" y1="74" x2="57.5" y2="72.5" stroke-width="2"/>
        <circle cx="68" cy="62" r="1.8" fill="currentColor"/>
        <line x1="68" y1="62" x2="76" y2="54" stroke-width="3"/>
        <path d="M 36.461 57.996 C 36.461 57.996 35.347 76.251 37.952 80.384 C 39.491 82.825 42.765 84.212 44.776 84.222 C 46.361 84.229 49.041 81.876 49.041 81.876"/>
      </svg>
    </button>
    <button title="Download result as CSV" onclick="exportCsv(this)"
      class="px-2 py-1 text-blue-400 hover:text-blue-300 hover:bg-gray-700 border border-gray-600 rounded text-sm inline-flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[27px] h-[27px]">
        <path d="M12 3v12" />
        <path d="M7 11l5 5 5-5" />
        <path d="M4 20h16" />
      </svg>
    </button>
    <button title="Format SQL (Ctrl+K)" onclick="formatSql(this)"
      style="margin-left:1.25em"
      class="px-2 py-1 text-blue-400 hover:text-blue-300 hover:bg-gray-700 border border-gray-600 rounded text-sm inline-flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[27px] h-[27px]">
        <line x1="4" y1="6" x2="20" y2="6" />
        <line x1="4" y1="12" x2="14" y2="12" />
        <line x1="4" y1="18" x2="18" y2="18" />
        <path d="M 19 10 L 20 12 L 22 13 L 20 14 L 19 16 L 18 14 L 16 13 L 18 12 Z" stroke-width="1.5" fill="currentColor" />
      </svg>
    </button>
    <span id="conn-badge" class="ml-auto text-xs text-gray-500 font-mono select-none"></span>
  </div>

  <!-- Top Pane: Query Editor & Scratch Pad Split View -->
  <div class="query-vsplit flex shrink-0" style="height: 300px;">

    <!-- Left Editor Pane -->
    <div class="q-editor relative flex flex-col" style="width: 75%; min-width: 160px;">
      <div class="flex items-center text-xs bg-gray-800 border-b border-gray-700 text-gray-400">
        <button type="button"
                data-script-tab="query"
                onclick="switchScriptPane(this)"
                class="script-tab px-3 py-1 text-gray-200 font-semibold border-r border-gray-700 cursor-pointer">
          Query
        </button>
      </div>
      <form id="query-editor" class="script-pane flex-1 m-0 flex flex-col min-h-0" data-pane="query" onsubmit="return false;">
        <!-- CodeMirror 6 host element; initialized by SqlEditor.init(panel). -->
        <div data-sql-editor class="flex-1 min-h-0 overflow-hidden"></div>
      </form>

      <!-- Find widget (Ctrl+F): client-side search over the CodeMirror
           document. Anchored to the Query pane; wiring in static/js/find.js. -->
      <div data-find-widget
           class="hidden absolute right-2 top-10 z-40 w-[280px] p-1.5 bg-gray-800 border border-gray-600 rounded shadow-xl">
        <div class="flex items-center gap-1 bg-gray-900 border border-gray-600 rounded px-1.5 py-0.5 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
          <input type="text" name="search" placeholder="Find"
                 class="find-input flex-1 bg-transparent outline-none text-sm text-gray-200 placeholder-gray-500"
                 autocomplete="off" spellcheck="false">
          <div class="flex items-center gap-0.5 shrink-0">
            <button type="button" title="Match Case"
                    class="btn-toggle px-1 py-0.5 rounded text-xs font-semibold text-gray-400 hover:bg-gray-700"
                    data-find-toggle="match-case">Aa</button>
            <input type="checkbox" name="find-match-case" class="find-match-case hidden">
            <button type="button" title="Use Regular Expression"
                    class="btn-toggle px-1 py-0.5 rounded text-xs font-semibold text-gray-400 hover:bg-gray-700"
                    data-find-toggle="regex">.*</button>
            <input type="checkbox" name="find-regex" class="find-regex hidden">
          </div>
        </div>
        <div class="flex justify-between items-center mt-1.5 px-0.5">
          <div class="flex gap-1.5">
            <button type="button" title="Previous Match (Shift+Enter)"
                    class="btn-find-prev px-1.5 rounded text-gray-300 hover:text-gray-100 hover:bg-gray-700 text-sm">&#8593;</button>
            <button type="button" title="Next Match (Enter)"
                    class="btn-find-next px-1.5 rounded text-gray-300 hover:text-gray-100 hover:bg-gray-700 text-sm">&#8595;</button>
          </div>
          <button type="button" title="Close (Escape)"
                  class="btn-close px-1.5 rounded text-gray-300 hover:text-gray-100 hover:bg-gray-700 text-xs">&#10005;</button>
        </div>
      </div>

      <!-- Find & Replace widget (Ctrl+R): same client-side principle as the
           find widget, with Replace / Replace All actions. -->
      <div data-findreplace-widget
           class="hidden absolute right-2 top-10 z-40 w-[340px] p-1.5 bg-gray-800 border border-gray-600 rounded shadow-xl">
        <div class="flex items-center gap-1 bg-gray-900 border border-gray-600 rounded px-1.5 py-0.5 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
          <input type="text" name="search" placeholder="Find"
                 class="find-input flex-1 bg-transparent outline-none text-sm text-gray-200 placeholder-gray-500"
                 autocomplete="off" spellcheck="false">
          <div class="flex items-center gap-0.5 shrink-0">
            <button type="button" title="Match Case"
                    class="btn-toggle px-1 py-0.5 rounded text-xs font-semibold text-gray-400 hover:bg-gray-700"
                    data-find-toggle="match-case">Aa</button>
            <input type="checkbox" name="find-match-case" class="find-match-case hidden">
            <button type="button" title="Use Regular Expression"
                    class="btn-toggle px-1 py-0.5 rounded text-xs font-semibold text-gray-400 hover:bg-gray-700"
                    data-find-toggle="regex">.*</button>
            <input type="checkbox" name="find-regex" class="find-regex hidden">
          </div>
        </div>
        <div class="flex items-center gap-1 mt-1 bg-gray-900 border border-gray-600 rounded px-1.5 py-0.5 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
          <input type="text" name="replace" placeholder="Replace with..."
                 class="replace-input flex-1 bg-transparent outline-none text-sm text-gray-200 placeholder-gray-500"
                 autocomplete="off" spellcheck="false">
        </div>
        <div class="flex justify-between items-center mt-1.5 px-0.5">
          <div class="flex gap-1.5">
            <button type="button" title="Previous Match (Shift+Enter)"
                    class="btn-find-prev px-1.5 rounded text-gray-300 hover:text-gray-100 hover:bg-gray-700 text-sm">&#8593;</button>
            <button type="button" title="Next Match (Enter)"
                    class="btn-find-next px-1.5 rounded text-gray-300 hover:text-gray-100 hover:bg-gray-700 text-sm">&#8595;</button>
          </div>
          <div class="flex gap-1.5">
            <button type="button" title="Replace next match (Enter in Replace field)"
                    class="btn-replace px-2 py-0.5 rounded text-xs text-gray-300 hover:text-gray-100 hover:bg-gray-700 border border-gray-600">
              Replace</button>
            <button type="button" title="Replace all matches"
                    class="btn-replace-all px-2 py-0.5 rounded text-xs text-gray-300 hover:text-gray-100 hover:bg-gray-700 border border-gray-600">
              All</button>
            <button type="button" title="Close (Escape)"
                    class="btn-close px-1.5 rounded text-gray-300 hover:text-gray-100 hover:bg-gray-700 text-xs">&#10005;</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Drag handle between Query and Scratch Pad -->
    <div class="query-resizer-v w-1 shrink-0 cursor-col-resize bg-gray-700 hover:bg-blue-500 transition-colors"
         title="Drag to resize"></div>

    <!-- Right Scratch Pad Pane -->
    <div class="flex flex-col flex-1 min-w-0">
      <div class="flex items-center justify-between px-2 py-1 text-xs bg-gray-800 border-b border-gray-700 text-gray-400">
        <span>Scratch Pad</span>
        <span class="cursor-pointer hover:text-gray-200" title="Clear Scratch Pad" onclick="clearScratchPad(this)">&#10005;</span>
      </div>
      <textarea name="scratchpad" class="flex-1 border-none outline-none p-2 resize-none box-border bg-gray-900 text-gray-200 placeholder-gray-500"></textarea>
    </div>
  </div>

  <!-- Drag handle between the editors and the results area -->
  <div class="query-resizer-h h-1 shrink-0 cursor-row-resize bg-gray-700 hover:bg-blue-500 transition-colors"
       title="Drag to resize"></div>

  <!-- Bottom Pane: Output Panel -->
  <div class="flex-1 flex flex-col min-h-0">

    <!-- Tab Navigation -->
    <div class="flex text-xs bg-gray-800 border-b border-gray-700">
      <div class="output-tab px-3 py-1.5 cursor-pointer border-r border-gray-700 text-blue-400 hover:text-gray-200 border-t-2 border-t-blue-500 font-bold" data-output-tab="data" onclick="switchOutputTab(this)">
        Data Output<span class="query-spinner hidden" aria-hidden="true"></span>
      </div>
      <div class="output-tab px-3 py-1.5 cursor-pointer border-r border-gray-700 text-gray-400 hover:text-gray-200 border-t-2 border-t-transparent font-normal" data-output-tab="messages" onclick="switchOutputTab(this)">
        Messages
      </div>
      <div class="output-tab px-3 py-1.5 cursor-pointer border-r border-gray-700 text-gray-400 hover:text-gray-200 border-t-2 border-t-transparent font-normal hidden" data-output-tab="explain" onclick="switchOutputTab(this)">
        Explain
      </div>
      <div class="output-tab px-3 py-1.5 cursor-pointer text-gray-400 hover:text-gray-200 border-t-2 border-t-transparent font-normal" data-output-tab="notifications" onclick="switchOutputTab(this)">
        Notifications
      </div>
    </div>

    <!-- Data Output Panel -->
    <div id="data-grid" class="output-panel flex-1 overflow-auto"></div>

    <!-- Messages Panel -->
    <div id="messages-panel" class="output-panel flex-1 overflow-auto hidden">
      <div class="p-3 text-xs font-mono text-gray-400"></div>
    </div>

    <!-- Explain Panel -->
    <div id="explain-panel" class="output-panel flex-1 overflow-auto hidden">
      <div class="p-3 text-xs font-mono text-gray-400"></div>
    </div>

    <!-- Notifications Panel -->
    <div id="notifications-panel" class="output-panel flex-1 overflow-auto hidden">
      <div class="p-3 text-xs text-gray-500 italic">No notifications.</div>
    </div>
  </div>

  <!-- Status Bar (pinned to bottom) -->
  <div class="flex items-center justify-between px-2 py-1 text-[11px] bg-gray-800 border-t border-gray-600 text-gray-300 shrink-0">
    <div class="query-status">Ready</div>
    <div class="pagination-controls hidden flex items-center gap-2">
      <button onclick="goToPage(this, 1)" class="px-1 hover:text-white hover:bg-gray-600 rounded" title="First page">|&lt;</button>
      <button onclick="goToPage(this, 'prev')" class="px-1 hover:text-white hover:bg-gray-600 rounded" title="Previous page">&lt;</button>
      <span class="page-info text-gray-200">Page 1 of 1</span>
      <button onclick="goToPage(this, 'next')" class="px-1 hover:text-white hover:bg-gray-600 rounded" title="Next page">&gt;</button>
      <button onclick="goToPage(this, 'last')" class="px-1 hover:text-white hover:bg-gray-600 rounded" title="Last page">&gt;|</button>
    </div>
  </div>

</div>
