<ul class="space-y-1 text-sm pl-2">
    {{ range .Nodes }}{{ if .URL }}
    <li{{ if .Menu }} data-tree-menu="{{ .Menu }}"{{ end }}{{ if .DataName }} data-name="{{ .DataName }}"{{ end }}{{ if .PropsURL }} data-props-url="{{ .PropsURL }}"{{ end }}{{ if .DataURL }} data-url="{{ .DataURL }}"{{ end }}{{ if .State }} data-tree-state="{{ .State }}"{{ end }}>
        <button class="hover:text-blue-400 text-left w-full"
                hx-get="{{ .URL }}"
                hx-target="#{{ .ID }}"
                hx-swap="innerHTML"
                hx-on::before-request="if (toggleTreeChildren('{{ .ID }}')) event.preventDefault()">
            {{ if eq .State "on" }}<span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1.5 align-middle"></span>{{ else if eq .State "off" }}<span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1.5 align-middle"></span>{{ else if eq .State "gray" }}<span class="rounded-full" style="display:inline-block;width:8px;height:8px;border:2px solid #94a3b8;margin-right:6px;vertical-align:middle"></span>{{ end }}{{ .Icon }} {{ .Label }}{{ with .Badge }}
            <span class="text-xs text-gray-500">({{ . }})</span>{{ end }}{{ with .Sub }}
            <span class="block text-xs text-gray-500">{{ . }}</span>{{ end }}
        </button>
        <div id="{{ .ID }}" class="ml-4"></div>
    </li>
    {{ else }}
    <li{{ if .Disabled }} class="opacity-60 text-gray-500 cursor-default select-none pointer-events-none"{{ else }} class="hover:text-blue-400 cursor-pointer"{{ end }}{{ if .Menu }} data-tree-menu="{{ .Menu }}"{{ end }}{{ if .DataName }} data-name="{{ .DataName }}"{{ end }}{{ if .PropsURL }} data-props-url="{{ .PropsURL }}"{{ end }}{{ if .DataURL }} data-url="{{ .DataURL }}"{{ end }}>{{ .Icon }} {{ .Label }}</li>
    {{ end }}{{ else }}
    <li class="opacity-60 text-gray-500 cursor-default select-none pointer-events-none">{{ $.EmptyMessage }}</li>
    {{ end }}
</ul>
