<div id="ddl-panel-{{ .PanelID }}" class="ddl-panel" data-panel-id="{{ .PanelID }}" data-preview="{{ .PreviewURL }}" data-action="{{ .Action }}" data-folder="{{ .FolderID }}" data-db="{{ .ConnDB }}">
    <div class="flex justify-between items-center px-4 py-2 border-b border-gray-700">
        <h3 class="text-sm font-bold text-white">{{ .Title }}</h3>
        <div class="flex items-center gap-2">
            <button type="button" data-panel-reset class="px-2 py-1 text-xs text-gray-300 hover:text-white border border-gray-600 rounded" title="Reload the form from the current definition (use after running the SQL)">Reset</button>
            <button type="button" data-panel-collapse class="px-2 py-1 text-sm text-gray-300 hover:text-white border border-gray-600 rounded" title="Hide this panel">&lt;&lt;</button>
        </div>
    </div>
    <div data-panel-status class="hidden px-4 py-1 text-xs text-yellow-400"></div>
    {{ if .Error }}<div class="text-xs text-red-400 bg-red-900/40 border border-red-800 rounded p-2 m-3">{{ .Error }}</div>{{ end }}

    <form class="space-y-4 p-4" onsubmit="return false">
            <input type="hidden" name="server_id" value="{{ .ServerID }}">
            <input type="hidden" name="folder_id" value="{{ .FolderID }}">
            <input type="hidden" name="db" value="{{ .DB }}">
            <input type="hidden" name="schema" value="{{ .Schema }}">
            <input type="hidden" name="table" value="{{ .Table }}">

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Name</label>
                    <input type="text" name="name" required placeholder="my_func" value="{{ index .Values "name" }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm"
                           autocomplete="off" spellcheck="false">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Return type</label>
                    <input type="text" name="returns" placeholder="integer, void, table(...)" value="{{ index .Values "returns" }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm"
                           autocomplete="off" spellcheck="false">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Arguments (optional, comma separated)</label>
                <input type="text" name="args" placeholder="a integer, b text" value="{{ index .Values "args" }}"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm"
                       autocomplete="off" spellcheck="false">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Language</label>
                    <input type="text" name="language" value="{{ index .Values "language" }}" placeholder="plpgsql"
                           class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm"
                           autocomplete="off" spellcheck="false">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Volatility</label>
                    <select name="volatility" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                        <option value="volatile" {{ if eq (index .Values "volatility") "volatile" }}selected{{ end }}>VOLATILE</option>
                        <option value="stable" {{ if eq (index .Values "volatility") "stable" }}selected{{ end }}>STABLE</option>
                        <option value="immutable" {{ if eq (index .Values "volatility") "immutable" }}selected{{ end }}>IMMUTABLE</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center space-x-2 text-sm text-gray-300">
                    <input type="checkbox" name="strict" {{ if eq (index .Values "strict") "on" }}checked{{ end }} class="accent-blue-500">
                    <span>STRICT (null on null input)</span>
                </label>
                <label class="flex items-center space-x-2 text-sm text-gray-300">
                    <input type="checkbox" name="security" {{ if eq (index .Values "security") "on" }}checked{{ end }} class="accent-blue-500">
                    <span>SECURITY DEFINER</span>
                </label>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Body</label>
                <textarea name="body" required rows="8" placeholder="BEGIN&#10;  RETURN ...;&#10;END;"
                          class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm font-mono"
                          spellcheck="false">{{ index .Values "body" }}</textarea>
            </div>
    </form>
</div>
