<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .Title }}{{ .Title }}{{ else }}Pg HTMX Admin{{ end }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <!-- Load htmx & CSS -->
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <link rel="stylesheet" href="/static/tailwind.css">
    <script type="module" src="/static/vendor/chart.bundle.js"></script>

    <style>
        /* Dark CodeMirror polish to match the Tailwind gray-900 UI. */
        .cm-editor { height: 100%; background: #111827; }
        .cm-tooltip.cm-tooltip-autocomplete {
            background-color: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            max-height: 260px;
            overflow-y: auto;
        }
        .cm-tooltip.cm-tooltip-autocomplete > ul { max-height: inherit; }
        .cm-tooltip.cm-tooltip-autocomplete li { color: #e5e7eb; padding: 3px 8px; }
        .cm-tooltip.cm-tooltip-autocomplete li[aria-selected] { background-color: #2563eb; color: #fff; }
        .cm-tooltip.cm-tooltip-autocomplete li[aria-selected] .cm-completionDetail { color: #cbd5e1; }
        .cm-tooltip.cm-tooltip-autocomplete .cm-completionIcon { opacity: 0.85; }

        /* Create Table dialog: one grid row per column keeps the name, type,
           nullability, default, generated-expression and key selectors
           vertically aligned. The Tailwind build is pre-compiled, so a
           custom class is used instead of grid-cols-* utilities. */
        /* Multiple result sets (static/js/results.js) */
        .rs-tabs { display: flex; gap: 4px; padding: 4px 8px; overflow-x: auto; background: #1f2937; border-bottom: 1px solid #374151; position: sticky; top: 0; z-index: 20; }
        .rs-tab { padding: 2px 10px; font-size: 11px; white-space: nowrap; color: #9ca3af; border: 1px solid #4b5563; border-radius: 4px; }
        .rs-tab:hover { color: #e5e7eb; background: #374151; }
        .rs-tab-active { color: #fff; background: #374151; border-color: #60a5fa; }
        .rs-tab-error { color: #f87171; border-color: #991b1b; }

        /* Transaction state badge (static/js/transactions.js) */
        .tx-badge { display: inline-flex; align-items: center; }
        .tx-active { color: #60a5fa; }
        .tx-aborted { color: #f87171; }
        .ac-toggle { position: relative; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
                     padding: 0.25rem 0.5rem; border: 1px solid #4b5563; border-radius: 0.25rem; color: #6b7280; }
        .ac-toggle:hover { background: #374151; }
        .ac-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
        .ac-toggle:has(input:checked) { color: #60a5fa; border-color: #2563eb; }

        /* Visual EXPLAIN (static/js/explain.js) */
        .xp-tabs { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid #374151; }
        .xp-tab { padding: 2px 10px; font-size: 11px; color: #9ca3af; border: 1px solid #4b5563; border-radius: 4px; }
        .xp-tab:hover { color: #e5e7eb; background: #374151; }
        .xp-tab-active { color: #fff; background: #374151; border-color: #60a5fa; }
        .xp-body { padding: 8px; font-size: 12px; overflow: auto; }
        .xp-node .xp-node { margin-left: 18px; border-left: 1px solid #374151; padding-left: 6px; }
        .xp-row { display: flex; align-items: center; gap: 8px; padding: 3px 4px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
        .xp-row:hover { background: rgba(55, 65, 81, 0.6); }
        .xp-toggle { width: 12px; color: #9ca3af; flex: none; }
        .xp-type { font-weight: 600; color: #e5e7eb; }
        .xp-target { color: #9ca3af; }
        .xp-bar { width: 90px; height: 8px; background: #1f2937; border-radius: 4px; overflow: hidden; flex: none; }
        .xp-bar-fill { display: block; height: 100%; }
        .xp-cool { background: #3b82f6; }
        .xp-warm { background: #f59e0b; }
        .xp-hot { background: #ef4444; }
        .xp-num { color: #d1d5db; font-variant-numeric: tabular-nums; }
        .xp-rows { color: #9ca3af; }
        .xp-badges { display: inline-flex; gap: 4px; }
        .xp-badge { font-size: 10px; padding: 0 6px; border-radius: 8px; color: #fbbf24; border: 1px solid #92400e; background: rgba(146, 64, 14, 0.25); }
        .xp-badge-hot { color: #fca5a5; border-color: #991b1b; background: rgba(153, 27, 27, 0.3); }
        .xp-details { margin: 2px 0 6px 20px; padding: 6px 8px; background: #111827; border: 1px solid #374151; border-radius: 4px; }
        .xp-details-table td { padding: 1px 12px 1px 0; vertical-align: top; }
        .xp-key { color: #9ca3af; white-space: nowrap; }
        .xp-val { color: #e5e7eb; font-family: ui-monospace, monospace; word-break: break-all; }
        .xp-table { border-collapse: collapse; width: 100%; }
        .xp-table th, .xp-table td { text-align: left; padding: 3px 10px; border: 1px solid #374151; }
        .xp-table th { color: #9ca3af; background: #1f2937; }
        .xp-raw { color: #d1d5db; font-size: 11px; white-space: pre-wrap; }
        .xp-footer { padding: 6px 12px; font-size: 11px; color: #9ca3af; border-top: 1px solid #374151; }
        .xp-note { margin-top: 2px; color: #fbbf24; }
        .ddl-col-row {
            display: grid;
            grid-template-columns: 1.1fr 1.1fr 0.8fr 1.1fr 1.3fr 0.6fr 1.5rem;
            gap: 0.25rem;
            align-items: center;
        }

        /* Alter Table dialog: one grid row per existing column (name label,
           rename, type, nullable, default, drop) and one per new column
           (name, type, nullable, default, remove button) — different item
           counts than .ddl-col-row above, so they get their own templates. */
        .ddl-edit-col-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.3fr 0.9fr 1.3fr 0.8fr;
            gap: 0.25rem;
            align-items: center;
        }
        .ddl-addcol-row {
            display: grid;
            grid-template-columns: 1.1fr 1.1fr 0.8fr 1.1fr 1.3fr 1.5rem;
            gap: 0.25rem;
            align-items: center;
        }

        /* Every modal (DDL create/alter/drop, save-script, add-server, ...)
           shares the same centered panel div. None of them cap its height,
           so a dialog whose content grows taller than the viewport (e.g.
           Alter Table with its Columns/Add columns/FK/Exclusion sections)
           overflows with no way to scroll to Cancel/Submit. Tailwind is
           pre-compiled with no max-h-[..vh]/overflow-y-auto combination
           built for this, so a custom class covers all of them at once. */
        .modal-panel {
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>

    <!-- Application scripts (split by purpose; see static/js/*.js) -->
    <script src="/static/js/toasts.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/layout.js"></script>
    <script src="/static/js/context-menu.js"></script>
    <script src="/static/js/tree.js"></script>
    <script src="/static/js/tabs.js"></script>
    <script src="/static/js/explain.js"></script>
    <script src="/static/js/transactions.js"></script>
    <script src="/static/js/results.js"></script>
    <script src="/static/js/listen.js"></script>
    <script src="/static/js/properties.js"></script>
    <script src="/static/js/ddl.js"></script>
    <script src="/static/js/save-dialog.js"></script>
    <script src="/static/js/workspace.js"></script>
    <script src="/static/js/find.js"></script>
    <script src="/static/js/monitoring.js"></script>

    <!-- CodeMirror 6 SQL editor: syntax highlighting + autocompletion
         (source: static/js/sql-editor.js, built to this single-file bundle
         by scripts/build-editor.mjs). Exposes window.SqlEditor
         (init/value/set/selection/focus) used by the tab logic above. -->
    <script type="module" src="/static/codemirror.bundle.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen font-sans antialiased" hx-request='{"credentials": "same-origin"}'>

    <!-- Right-click context menu (filled in and shown by initContextMenu) -->
    <div id="ctx-menu"
         class="fixed z-50 hidden select-none bg-gray-800 border border-gray-600 rounded shadow-xl text-sm text-gray-200 py-1 min-w-[11rem]"></div>

    {{ if not .Authenticated }}
    <!-- ==========================================
         1. UNAUTHENTICATED LAYOUT (Login Shell)
         ========================================== -->
    <div class="flex items-center justify-center min-h-screen p-4" id="app-root">
        {{ template "login_content" . }}
    </div>

    {{ else }}
    <!-- ==========================================
         2. AUTHENTICATED LAYOUT (Main Application Shell)
         ========================================== -->
    <div class="flex flex-col h-screen overflow-hidden" id="app-root">
        
        <!-- Header / Server Switcher -->
        <header class="w-full bg-gray-800 border-b border-gray-700 flex justify-between items-center p-4">
            <span class="font-bold text-lg text-blue-400">Pg HTMX Admin</span>
            <button hx-post="/logout" 
                    hx-target="#app-root" 
                    hx-select="#app-root"
                    hx-swap="outerHTML" 
                    class="text-xs bg-gray-700 hover:bg-red-600 text-gray-300 hover:text-white px-2 py-1 rounded transition">
                Logout
            </button>
        </header>

        <!-- Main Content Area (SQL Editor / Table Data View) -->
        {{ template "main_content" . }}

    </div>
    {{ end }}

</body>
</html>

{{ define "login_content" }}
  <!-- Default empty fallback if not defined by login.html -->
{{ end }}

{{ define "main_content" }}
  <!-- Default empty fallback if not defined by index.html -->
{{ end }}
