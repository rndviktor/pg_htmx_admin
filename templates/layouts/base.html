<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .Title }}{{ .Title }}{{ else }}Pg HTMX Admin{{ end }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <!-- Load htmx & CSS -->
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <link rel="stylesheet" href="/static/tailwind.css">
    <script type="module" src="/static/vendor/chart.bundle.js"></script>

    <style>
        /* Dark CodeMirror polish to match the Tailwind gray-900 UI. */
        .cm-editor { height: 100%; background: #111827; }
        .cm-tooltip.cm-tooltip-autocomplete {
            background-color: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            max-height: 260px;
            overflow-y: auto;
        }
        .cm-tooltip.cm-tooltip-autocomplete > ul { max-height: inherit; }
        .cm-tooltip.cm-tooltip-autocomplete li { color: #e5e7eb; padding: 3px 8px; }
        .cm-tooltip.cm-tooltip-autocomplete li[aria-selected] { background-color: #2563eb; color: #fff; }
        .cm-tooltip.cm-tooltip-autocomplete li[aria-selected] .cm-completionDetail { color: #cbd5e1; }
        .cm-tooltip.cm-tooltip-autocomplete .cm-completionIcon { opacity: 0.85; }
    </style>

    <!-- Application scripts (split by purpose; see static/js/*.js) -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/layout.js"></script>
    <script src="/static/js/context-menu.js"></script>
    <script src="/static/js/tree.js"></script>
    <script src="/static/js/tabs.js"></script>
    <script src="/static/js/properties.js"></script>
    <script src="/static/js/ddl.js"></script>
    <script src="/static/js/save-dialog.js"></script>
    <script src="/static/js/workspace.js"></script>
    <script src="/static/js/find.js"></script>
    <script src="/static/js/monitoring.js"></script>

    <!-- CodeMirror 6 SQL editor: syntax highlighting + autocompletion
         (source: static/js/sql-editor.js, built to this single-file bundle
         by scripts/build-editor.mjs). Exposes window.SqlEditor
         (init/value/set/selection/focus) used by the tab logic above. -->
    <script type="module" src="/static/codemirror.bundle.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen font-sans antialiased" hx-request='{"credentials": "same-origin"}'>

    <!-- Right-click context menu (filled in and shown by initContextMenu) -->
    <div id="ctx-menu"
         class="fixed z-50 hidden select-none bg-gray-800 border border-gray-600 rounded shadow-xl text-sm text-gray-200 py-1 min-w-[11rem]"></div>

    {{ if not .Authenticated }}
    <!-- ==========================================
         1. UNAUTHENTICATED LAYOUT (Login Shell)
         ========================================== -->
    <div class="flex items-center justify-center min-h-screen p-4" id="app-root">
        {{ template "login_content" . }}
    </div>

    {{ else }}
    <!-- ==========================================
         2. AUTHENTICATED LAYOUT (Main Application Shell)
         ========================================== -->
    <div class="flex flex-col h-screen overflow-hidden" id="app-root">
        
        <!-- Header / Server Switcher -->
        <header class="w-full bg-gray-800 border-b border-gray-700 flex justify-between items-center p-4">
            <span class="font-bold text-lg text-blue-400">Pg HTMX Admin</span>
            <button hx-post="/logout" 
                    hx-target="#app-root" 
                    hx-select="#app-root"
                    hx-swap="outerHTML" 
                    class="text-xs bg-gray-700 hover:bg-red-600 text-gray-300 hover:text-white px-2 py-1 rounded transition">
                Logout
            </button>
        </header>

        <!-- Main Content Area (SQL Editor / Table Data View) -->
        {{ template "main_content" . }}

    </div>
    {{ end }}

</body>
</html>

{{ define "login_content" }}
  <!-- Default empty fallback if not defined by login.html -->
{{ end }}

{{ define "main_content" }}
  <!-- Default empty fallback if not defined by index.html -->
{{ end }}
